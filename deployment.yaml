apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask
        image: asia-east1-docker.pkg.dev/itp4122project/itp4122-repo/flask-app:latest
        ports:
        - containerPort: 8080
        command: ["gunicorn"]
        args: ["--bind", "0.0.0.0:8080", "microblog:app"]

        envFrom:
          - configMapRef:
              name: flask-config          

        env:
          - name: DB_USER
            value: "esther"
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DB_PASS
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: SECRET_KEY

        volumeMounts:
          - name: filestore-volume
            mountPath: /app/shared

      volumes:
        - name: filestore-volume
          persistentVolumeClaim:
            claimName: itp4122-filestore-pvc